# Toàn bộ hệ thống: nginx -> frontend (Next.js) -> backend (NestJS) -> db (MariaDB/MySQL).
#
# Đừng chạy file này bằng tay: `make deploy <môi trường>` (deploy/deploy.sh) sinh
# file .env đầy đủ rồi gọi `docker compose --env-file ... -f deploy/docker-compose.yml`.
#
# Chỉ nginx mở cổng ra ngoài. Backend không lộ ra internet: frontend gọi nó
# qua mạng nội bộ của Docker kèm BACKEND_API_KEY.

name: ${COMPOSE_PROJECT_NAME:-business-platform}

services:
  db:
    image: ${DB_IMAGE:-mariadb:11.4}
    restart: unless-stopped
    environment:
      # Cả image mariadb lẫn mysql đều hiểu các biến MYSQL_*.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Thiếu DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-business-platform}
      MYSQL_USER: ${DB_USER:?Thiếu DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # mariadb:11 không còn lệnh mysqladmin, mysql thì không có mariadb-admin.
      test:
        - CMD-SHELL
        - mariadb-admin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent || mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ../backend
    image: ${COMPOSE_PROJECT_NAME:-business-platform}-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      FRONTEND_ORIGIN: ${APP_URL:?Thiếu APP_URL}
      BACKEND_API_KEY: ${BACKEND_API_KEY:?Thiếu BACKEND_API_KEY}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-business-platform}
      UPLOAD_DIR: /app/data/uploads
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # Email đơn hàng — SMTP_HOST trống thì tắt.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
    volumes:
      - uploads:/app/data/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_CKEDITOR_LICENSE_KEY: ${NEXT_PUBLIC_CKEDITOR_LICENSE_KEY:-}
    image: ${COMPOSE_PROJECT_NAME:-business-platform}-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      AUTH_URL: ${APP_URL}
      AUTH_SECRET: ${AUTH_SECRET:?Thiếu AUTH_SECRET}
      # Chạy sau nginx: tin header Host/X-Forwarded-* do nginx đặt.
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      BACKEND_URL: http://backend:4000/api
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      DEV_LOGIN: "off"
      TZ: ${TZ:-Asia/Ho_Chi_Minh}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?Thiếu DOMAIN}
      # http: chỉ HTTP (local, hoặc lúc chưa có chứng chỉ); https: HTTP chuyển sang HTTPS.
      NGINX_MODE: ${NGINX_MODE:-http}
    command: ["/bin/sh", "/etc/nginx/entrypoint.sh"]
    volumes:
      - ./nginx/entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - ./nginx/templates:/etc/nginx/site-templates:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro

  # Chỉ chạy khi cần (`docker compose run certbot ...`), không chạy thường trực.
  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

  # Gia hạn chứng chỉ tự động (bật khi SSL_ENABLED=true qua COMPOSE_PROFILES=ssl).
  # Nginx tự reload 6 giờ một lần nên nhận chứng chỉ mới mà không cần restart.
  certbot-renew:
    image: certbot/certbot:latest
    profiles: ["ssl"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $$!; done
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  db-data:
  uploads:
  certbot-www:
  letsencrypt:
